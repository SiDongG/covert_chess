# Conda alternative to requirements.txt / requirements-lock.txt.
#
# Create with:   conda env create -f environment.yml
# Activate with: conda activate bam-artifact
#
# The pip section installs the GPU torch wheel for CUDA 12.4 (the build the
# experiments ran on). Adjust the --extra-index-url / version if your CUDA
# toolkit differs.
name: bam-artifact
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - transformers==5.14.1
      - tokenizers==0.22.2
      - accelerate==1.13.0
      - datasets==4.8.5
      - huggingface-hub==1.25.1
      - safetensors==0.8.0
      - numpy==2.3.5
      - scipy==1.17.1
      - pandas==3.0.3
      - matplotlib==3.10.9
      - chess==1.11.2
      - POT==0.9.6.post1        # imported as `ot` (arcmark/sinkhorn.py)
      - protobuf==5.29.6
      # Optional (eval_pipeline.py judge only):
      # - google-genai==2.12.1